# 规则集定义：每个集合由上游规则 + 自定义规则合并而成
# upstream: 上游地址（Clash 格式，构建时同时转换成 Loon）
# custom:   仓库内自定义规则，按平台分开，和上游一起合并去重排序；可写单个路径或列表
#           Loon 同时读取 Clash 自定义（域名/IP 通用）和 Loon 专有规则（如 USER-AGENT）
# min_rules: 去重后最少规则数，低于此值视为上游异常，中止发布

sets:
  ad:
    min_rules: 5000
    upstream:
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising_Classical.yaml
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdGuardSDNSFilter/AdGuardSDNSFilter_Classical.yaml
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/EasyPrivacy/EasyPrivacy_Classical.yaml
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Hijacking/Hijacking.yaml
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AdvertisingMiTV/AdvertisingMiTV.yaml
      - https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
      - https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
      - https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
      - https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml

  ai:
    min_rules: 30
    upstream:
      - https://raw.githubusercontent.com/viewer12/OverseasAI.list/main/rule/Clash/OverseasAI/OverseasAI.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list
      # Grok / xAI
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/xai.yaml
      # 海外 AI 总集
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.yaml

  cloud-drive:
    min_rules: 30
    upstream:
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleDrive/GoogleDrive.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Dropbox/Dropbox.list
      - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/mega.yaml

  social:
    min_rules: 50
    upstream:
      - https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/socialmedia.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Instagram/Instagram.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Facebook/Facebook.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Discord/Discord.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Reddit/Reddit.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

  streaming:
    min_rules: 50
    upstream:
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AmazonPrimeVideo/AmazonPrimeVideo.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitch/Twitch.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/HBO/HBO.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Hulu/Hulu.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AppleTV/AppleTV.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ParamountPlus/ParamountPlus.list

  # 推送服务：全部走代理，规则里必须排在 direct 之前，
  # 否则 push.apple.com 会先被 direct 里的 apple.com 命中
  push:
    min_rules: 20
    custom:
      clash: Clash/Push.yaml
      loon: Clash/Push.yaml
    upstream:
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list

  direct:
    min_rules: 3000
    custom:
      clash: Clash/Direct.yaml
      loon: [Clash/Direct.yaml, Loon/Direct.lsr]
    upstream:
      - https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
      - https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
      - https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
      - https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Classical.yaml
      - https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.list
      - https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

  proxy:
    min_rules: 2000
    # 上游 Global 等把下列域名收进了代理，这里剔除，让它们走 direct：
    # Apple / iCloud、国内云厂商海外节点、Spotify。
    # 自定义的 push.apple.com 等推送域名仍保留在 proxy
